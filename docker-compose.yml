version: '3.4'

services:
  hsextract:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_S3_ENDPOINT=http://minio:9000
    volumes:
      - ./hsextract:/app/hsextract
      - ./hsextract_dbos:/app/hsextract_dbos
      - ./tests:/app/tests
      - ./dbos-tests:/app/dbos-tests
  minio:
    image: minio/minio
    platform: linux/amd64
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_NOTIFY_WEBHOOK_ENABLE_HSEXTRACT=on
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_HSEXTRACT=http://hsextract:8000/minio_event
      - MINIO_NOTIFY_WEBHOOK_AUTH_TYPE_HSEXTRACT=none
      # mc event add hsextract/test-bucket "arn:minio:sqs::HSEXTRACT:webhook" --event put,delete
    command: server --address ":9000" --console-address ":9001" /data
    volumes:
      - minio_data:/data
volumes:
  minio_data:
    driver: local
