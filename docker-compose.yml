version: '3.4'

services:
  hsextract:
    image: hydroshare/hsextract:0.10.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=cuahsi
      - AWS_SECRET_ACCESS_KEY=YXBzamR2IHBhc29q
      - AWS_S3_ENDPOINT=https://s3.beta.hydroshare.org
      - DBOS_DATABASE_URL=postgresql://user:password@postgres:5431/dbos
      - TESTING_DATABASE_URL=postgresql://user:password@dbtest:5432/testdb
      - DBOS_CONDUCTOR_KEY=dbos_cd53171a-28c3-4e9e-b165-d85252f426d5_2488266e-dad0-4b05-b243-487e16b2abac
    volumes:
      - ./hsextract:/app/hsextract
      - ./hsextract_dbos:/app/hsextract_dbos
      - ./tests:/app/tests
      - ./dbos-tests:/app/dbos-tests
    links:
      - postgres:postgres
      - dbtest:dbtest
    depends_on:
      - postgres
      - dbtest
  postgres:
    image: postgres:latest
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbos
    volumes:
      - postgres_data:/var/lib/postgresql/data
  dbtest:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - 5432:5432
    volumes:
      - dbtest_data:/var/lib/postgresql/data
volumes:
  postgres_data:
    driver: local
  dbtest_data:
    driver: local